" style="stroke:#181818;stroke-width:0.5;"/><path d="M1208.0521,493.9866 L1208.0521,503.9866 L1218.0521,503.9866 L1208.0521,493.9866" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="289.6182" x="834.93" y="512.5217">Link e senha permitem um &#250;nico ingresso.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="368.1221" x="834.93" y="529.01">Sem expira&#231;&#227;o temporal; reemiss&#227;o revoga o anterior.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="343.0615" x="834.93" y="545.4983">Um aparelho por perfil; confirmar troca de acesso.</text></g><!--link Admin to UC01--><g class="link" data-entity-1="Admin" data-entity-2="UC01" data-source-line="33" data-uid="lnk14" id="link_Admin_UC01"><path d="M103.64,306.4566 C204.26,299.5966 438.68,283.6366 568,274.8266" fill="none" id="Admin-UC01" style="stroke:#334155;stroke-width:1;"/></g><!--link Admin to UC02--><g class="link" data-entity-1="Admin" data-entity-2="UC02" data-source-line="34" data-uid="lnk15" id="link_Admin_UC02"><path d="M103.64,313.2266 C201.34,320.3666 425.17,336.7266 556.46,346.3266" fill="none" id="Admin-UC02" style="stroke:#334155;stroke-width:1;"/></g><!--link Admin to UC10--><g class="link" data-entity-1="Admin" data-entity-2="UC10" data-source-line="35" data-uid="lnk16" id="link_Admin_UC10"><path d="M56.62,348.2166 C60.55,411.4566 78.59,535.9166 158.3,591.7266 C278.45,675.8566 371.39,680.2666 488.33,591.7266 C528.82,561.0666 483.9,518.1166 519.33,481.7266 C538.62,461.9066 566.87,451.1766 592.81,445.3866" fill="none" id="Admin-UC10" style="stroke:#334155;stroke-width:1;"/></g><!--link Membro to UC10--><g class="link" data-entity-1="Membro" data-entity-2="UC10" data-source-line="36" data-uid="lnk17" id="link_Membro_UC10"><path d="M351.59,430.4566 C403.44,431.8566 517.59,434.9366 590.88,436.91